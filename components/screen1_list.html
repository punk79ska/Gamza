<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감자마켓 - 따뜻한 이웃 중고 거래</title>
  
  <!-- Global Design Tokens -->
  <link rel="stylesheet" href="../shared/design_tokens.css">
  <link rel="stylesheet" href="../shared/auth.css">
  
  <!-- Screen 1 Styles -->
  <link rel="stylesheet" href="./screen1_list.css">
</head>
<body>

  <!-- Screen 1 Component Root -->
  <div id="screen1-root" class="gamza-screen1">
    
    <!-- 1. Top Header -->
    <header class="gamza-header">
      <div class="header-container">
        
        <!-- Brand Logo -->
        <a href="#" class="brand-logo" id="brand-logo" title="감자마켓 홈으로 이동">
          <div class="logo-icon-wrap">
            <!-- Cute Potato SVG Symbol -->
            <svg class="logo-potato-svg" viewBox="0 0 24 24">
              <path d="M18.8 6.5c-1.5-2.2-4.2-3.5-7.1-3.5-4.2 0-7.7 2.6-8.7 6.6-.7 2.8-.2 5.7 1.3 8.1 1.6 2.6 4.4 4.3 7.5 4.3 3.6 0 7-2.1 8.5-5.3 1.2-2.5 1.1-5.6-.2-8.2zM7.5 10c-.8 0-1.5-.7-1.5-1.5S6.7 7 7.5 7s1.5.7 1.5 1.5S8.3 10 7.5 10zm8 4c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5zm-5 4c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z"/>
            </svg>
          </div>
          <div class="logo-text-group">
            <div class="logo-title">
              감자 <span class="tag">마켓</span>
            </div>
            <div class="logo-sub">우리 동네 따뜻한 직거래</div>
          </div>
        </a>

        <!-- Search Bar -->
        <div class="search-wrapper">
          <input 
            type="search" 
            id="search-input" 
            class="search-input-box" 
            placeholder="동네 이름, 물품명, 브랜드 검색 (예: 맥북, 원목 테이블)" 
            autocomplete="off"
            aria-label="상품 검색"
          />
          <svg class="search-icon-svg" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="검색어 지우기" title="검색어 지우기">×</button>
        </div>

        <!-- Header Action Buttons: [로그인] / [닉네임 + 로그아웃], [글쓰기] -->
        <div class="header-actions">
          <div id="auth-logged-out" class="auth-header-group">
            <button type="button" id="btn-login" class="btn-login" aria-label="감자마켓 로그인">
              로그인
            </button>
          </div>

          <div id="auth-logged-in" class="auth-header-group hidden">
            <div class="header-user-badge" id="header-user-badge" title="내 감자 프로필">
              <span class="header-user-potato">🥔</span>
              <span class="header-user-nickname" id="header-user-nickname">내 닉네임</span>
              <span class="header-user-temp" id="header-user-temp">36.5℃</span>
            </div>
            <button type="button" id="btn-logout" class="btn-logout" aria-label="로그아웃" title="로그아웃">
              로그아웃
            </button>
          </div>
          
          <button type="button" id="btn-write" class="btn-write">
            <svg viewBox="0 0 24 24">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
            <span>글쓰기</span>
          </button>
        </div>

      </div>
    </header>

    <!-- 2. Main Content Area -->
    <main class="gamza-main">
      
      <!-- Sub Greeting / Community Banner -->
      <section class="warm-banner" aria-label="감자마켓 이웃 환영 배너">
        <div class="warm-banner-content">
          <h2>🥔 포슬포슬 따뜻한 이웃 간의 거래</h2>
          <p>역삼동 이웃들이 정성껏 내놓은 오늘자의 감자(물품)들을 확인해보세요!</p>
        </div>
        <div class="banner-badge">
          인증된 동네 이웃 100% 직거래
        </div>
      </section>

      <!-- Filter & Controls Section -->
      <section class="controls-card" aria-label="상품 카테고리 및 필터">
        
        <!-- Category Pill Navigation Bar -->
        <div class="category-bar-wrapper">
          <div class="category-scroll-container" role="tablist" aria-label="카테고리 선택">
            <button type="button" class="category-pill active" data-category="전체" role="tab" aria-selected="true">
              <span class="cat-icon">🥔</span> 전체
            </button>
            <button type="button" class="category-pill" data-category="디지털기기" role="tab" aria-selected="false">
              <span class="cat-icon">💻</span> 디지털기기
            </button>
            <button type="button" class="category-pill" data-category="가구/인테리어" role="tab" aria-selected="false">
              <span class="cat-icon">🛋️</span> 가구/인테리어
            </button>
            <button type="button" class="category-pill" data-category="의류" role="tab" aria-selected="false">
              <span class="cat-icon">👕</span> 의류
            </button>
            <button type="button" class="category-pill" data-category="생활가전" role="tab" aria-selected="false">
              <span class="cat-icon">☕</span> 생활가전
            </button>
            <button type="button" class="category-pill" data-category="도서/티켓" role="tab" aria-selected="false">
              <span class="cat-icon">📚</span> 도서/티켓
            </button>
            <button type="button" class="category-pill" data-category="반려동물 용품" role="tab" aria-selected="false">
              <span class="cat-icon">🐶</span> 반려동물 용품
            </button>
            <button type="button" class="category-pill" data-category="기타" role="tab" aria-selected="false">
              <span class="cat-icon">📦</span> 기타
            </button>
          </div>
        </div>

        <!-- Filter Meta Bar: Counter, Toggle, Sort -->
        <div class="filter-meta-bar">
          
          <div class="meta-count-area">
            총 <strong id="product-count-number">0</strong>개의 감자
            <span id="active-filter-tags"></span>
          </div>

          <div class="meta-controls-right">
            <!-- '거래 가능만 보기' Toggle Switch -->
            <label class="toggle-available-label" for="toggle-available">
              <input type="checkbox" id="toggle-available" class="toggle-switch-input" />
              <span class="toggle-slider"></span>
              <span>거래 가능만 보기</span>
            </label>

            <!-- Sort Select Dropdown -->
            <div class="sort-select-wrapper">
              <select id="sort-select" class="sort-select" aria-label="상품 정렬 순서">
                <option value="latest">최신순</option>
                <option value="popular">인기순</option>
                <option value="price-asc">낮은 가격순</option>
                <option value="price-desc">높은 가격순</option>
              </select>
            </div>
          </div>

        </div>

      </section>

      <!-- 3. Product Cards Grid -->
      <section class="product-grid" id="product-grid" aria-label="상품 목록 그리드">
        <!-- Products will be dynamically rendered by screen1_list.js -->
      </section>

      <!-- 4. Empty State (When 0 items match) -->
      <div class="empty-state-card" id="empty-state" style="display: none;">
        <div class="empty-potato-icon">🥔</div>
        <h3 class="empty-state-title">찾으시는 감자가 없어요!</h3>
        <p class="empty-state-desc">
          검색어 철자를 확인해보시거나, 활성화된 필터를 초기화하여 다른 동네 물품들을 둘러보세요.
        </p>
        <button type="button" class="btn-reset-filters" id="btn-reset-empty">
          필터 초기화
        </button>
      </div>

    </main>

    <!-- Global Toast Container -->
    <div id="gamza-toast-container" class="gamza-toast-container" aria-live="polite"></div>

  </div>

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase 연동 클라이언트 브릿지 -->
  <script src="../shared/supabase_client.js"></script>

  <!-- Shared Mock Data -->
  <script src="../shared/mock_data.js"></script>
  
  <!-- Screen 1 Logic -->
  <script src="./screen1_list.js"></script>

</body>
</html>
